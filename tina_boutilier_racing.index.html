function reset(){player.x=425;cars=[];stars=[];score=0;frame=0;roadShift=0;running=true;paused=false;keys={};overlay.style.display='none';document.getElementById('pause').textContent='Ⅱ PAUSE'}function level(){return Math.min(10,1+Math.floor(score/180))}function spawn(){let lanes=[280,385,495,590],lane=lanes[Math.floor(Math.random()*lanes.length)],lv=level();cars.push({x:lane,y:-110,w:48,h:82,color:['#f34343','#2ca7ff','#ffcc24','#b95bff'][Math.floor(Math.random()*4)],speed:2+Math.random()*2+(lv-1)*0.55})}function overlap(a,b){return a.x+8<b.x+b.w-8&&a.x+a.w-8>b.x+8&&a.y+10<b.y+b.h-10&&a.y+a.h-10>b.y+10}function end(){running=false;overlay.style.display='grid';document.getElementById('ovtitle').textContent='RACE OVER!';document.getElementById('ovtext').textContent='You scored '+score+' points and reached level '+level()+'. The race gets faster every 180 points. Ready to try again?';document.getElementById('start').textContent='RACE AGAIN'}function tick(){if(running&&!paused){frame++;const lv=level(),pace=1+(lv-1)*0.11;roadShift+=5*pace;if(keys.left)player.x-=5.2;if(keys.right)player.x+=5.2;player.x=Math.max(238,Math.min(617,player.x));const spawnEvery=Math.max(30,75-(lv-1)*5);if(frame%spawnEvery===0)spawn();if(frame%Math.max(65,140-(lv-1)*7)===0)stars.push({x:[300,420,550,610][Math.floor(Math.random()*4)],y:-20});cars.forEach(q=>q.y+=(5+q.speed)*pace);stars.forEach(s=>s.y+=4.5*pace);cars=cars.filter(q=>q.y<H+100);stars=stars.filter(s=>s.y<H+20);for(let q of cars)if(overlap(player,q)){end();break}for(let i=stars.length-1;i>=0;i--){let s=stars[i];if(player.x<s.x+18&&player.x+player.w>s.x-18&&player.y<s.y+18&&player.y+player.h>s.y-18){score+=25;stars.splice(i,1)}}if(frame%6===0)score++;if(score>best){best=score;try{localStorage.tinaBoutilierBest=best}catch(e){}}}draw();requestAnimationFrame(tick)}
document.getElementById('start').onclick=()=>{if(paused){paused=false;overlay.style.display='none'}else reset()};document.getElementById('restart').onclick=reset;document.getElementById('pause').onclick=()=>{if(!running)return;paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE';overlay.style.display=paused?'grid':'none';if(paused){document.getElementById('ovtitle').textContent='PIT STOP';document.getElementById('ovtext').textContent='Race paused. Ready when you are.';document.getElementById('start').textContent='RESUME'}};
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=true;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=true;if(e.key.toLowerCase()==='r')reset();if(e.key===' '&&running){document.getElementById('pause').click()}});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')keys.left=false;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')keys.right=false});function hold(id,k){let el=document.getElementById(id);el.onpointerdown=e=>{e.preventDefault();keys[k]=true};for(let ev of ['pointerup','pointerleave','pointercancel'])el.addEventListener(ev,e=>{keys[k]=false})}hold('left','left');hold('right','right');draw();requestAnimationFrame(tick);
</script></body></html>
